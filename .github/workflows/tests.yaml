name: Tests

on:
    pull_request: null
    push:
        branches:
            - main

jobs:
    tests:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['7.2', '8.0', '8.4']

        name: PHP ${{ matrix.php }}

        steps:
            -   uses: actions/checkout@v4

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    coverage: none

            # the lock file is not committed, so resolve dependencies for this PHP version
            -   run: composer update --no-progress --ansi

            -   run: vendor/bin/phpunit

            # dogfooding - audit our own dependencies
            -   run: bin/sechole composer.lock
